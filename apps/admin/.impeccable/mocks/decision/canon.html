<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Serif:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:#f7f7f5;color:#0c0d0e;font-family:Roboto,Arial,sans-serif}.app{display:grid;grid-template-columns:250px 1fr;height:900px}.side{padding:30px 20px;background:#fff;border-right:1px solid #e3e4e0}.brand{display:flex;align-items:center;gap:12px;margin-bottom:56px}.bb{width:43px;height:43px;display:grid;place-items:center;border-radius:8px;background:#0c0d0e;color:#a2cb10;font:700 18px 'Roboto Serif',serif}.brand strong{font:600 16px 'Roboto Serif',serif}.brand small{display:block;color:#6e6d6b;font-size:11px;margin-top:3px}.section{margin:24px 12px 9px;color:#848780;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.nav{display:grid;gap:5px}.nav div{padding:13px 14px;border-radius:8px;color:#50534e;font-size:13px}.nav .active{background:#eef4dd;color:#26310d;font-weight:700}.main{padding:34px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px;color:#6e6d6b;font-size:12px}.profile{width:34px;height:34px;background:#edf2e0;border-radius:50%;display:grid;place-items:center;color:#324214;font-weight:700}.head{display:flex;align-items:end;justify-content:space-between;margin-bottom:25px}.head h1{font:600 33px 'Roboto Serif',serif;margin:0 0 8px}.head p{margin:0;color:#6e6d6b;font-size:14px}.button{padding:12px 18px;border:0;border-radius:8px;background:#a2cb10;font-weight:700}.filters{display:flex;gap:12px;margin-bottom:18px}.input,.select{height:42px;border:1px solid #dedfda;border-radius:8px;background:#fff;padding:0 14px;color:#777;font-size:12px}.input{width:380px}.select{width:175px}.table{background:#fff;border:1px solid #e2e3df;border-radius:10px;padding:0 18px}.row{display:grid;grid-template-columns:2fr .8fr 1fr 1fr 84px;gap:16px;align-items:center;height:64px;border-bottom:1px solid #ecece9}.row:last-child{border:0}.th{height:48px;color:#777a73;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.bar{height:9px;border-radius:8px;background:#e7e8e4}.bar.long{width:216px}.bar.mid{width:82px}.status{height:22px;width:82px;border-radius:99px;background:#edf3dc}.draft{background:#f6ebea}
  </style>
</head>
<body><div class="app"><aside class="side"><div class="brand"><span class="bb">BB</span><span><strong>TraderLab</strong><small>Gestão · Bruno Borges</small></span></div><div class="section">Workspace</div><nav class="nav"><div>Início</div><div>Alunos</div><div>Matrículas</div><div class="active">Cursos</div><div>Banners</div><div>Notificações</div></nav></aside><main class="main"><header class="top"><span>Ambiente de gestão</span><span class="profile">B</span></header><section class="head"><div><h1>Cursos</h1><p>Consulte e mantenha o catálogo de cursos da plataforma.</p></div><button class="button">＋&nbsp; Novo curso</button></section><section class="filters"><div class="input">⌕ &nbsp; Buscar cursos pelo título</div><div class="select">Todas as situações &nbsp;⌄</div></section><section class="table"><div class="row th"><span>Curso</span><span>Módulos</span><span>Atualizado</span><span>Estado</span><span>Ações</span></div><div class="row"><i class="bar long"></i><i class="bar mid"></i><i class="bar mid"></i><i class="status"></i><i class="bar"></i></div><div class="row"><i class="bar long"></i><i class="bar mid"></i><i class="bar mid"></i><i class="status draft"></i><i class="bar"></i></div><div class="row"><i class="bar long"></i><i class="bar mid"></i><i class="bar mid"></i><i class="status"></i><i class="bar"></i></div></section></main></div></body></html>
