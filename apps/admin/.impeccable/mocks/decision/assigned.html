  <style>
    *{box-sizing:border-box}html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:#f4f2ec;color:#0c0d0e;font-family:Roboto,Arial,sans-serif}.app{display:grid;grid-template-columns:250px 1fr;height:900px}.side{background:#fffbf7;padding:30px 20px;border-right:1px solid #e8e4dc}.brand{display:flex;align-items:center;gap:12px;margin-bottom:56px}.bb{display:grid;place-items:center;width:43px;height:43px;background:#0c0d0e;color:#a2cb10;font:700 19px 'Roboto Serif',serif;border-radius:10px}.brand strong{font:600 16px 'Roboto Serif',serif}.brand small{display:block;color:#6e6d6b;font-size:11px;margin-top:3px}.section{margin:24px 12px 9px;color:#96938d;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.nav{display:grid;gap:5px}.nav div{padding:13px 14px;border-radius:11px;color:#55544f;font-size:13px}.nav .active{background:#edf3d8;color:#18211d;font-weight:700;box-shadow:0 4px 14px #19230d12;position:relative}.nav .active:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:#a2cb10}.main{padding:34px 52px;position:relative}.rail{position:absolute;left:31px;top:90px;bottom:70px;width:2px;background:linear-gradient(#a2cb10 0 58%,#d8d4ca 58%);opacity:.9}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:42px}.eyebrow{font-size:10px;letter-spacing:.14em;color:#78766f;text-transform:uppercase}.profile{width:34px;height:34px;border-radius:50%;background:#e5e9d7;display:grid;place-items:center;font-weight:700;color:#26310d}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:27px}.heading h1{font:600 34px 'Roboto Serif',serif;margin:0 0 8px}.heading p{margin:0;color:#6e6d6b;font-size:14px}.button{border:0;border-radius:11px;background:#a2cb10;color:#0c0d0e;padding:13px 19px;font-weight:700;font-size:13px;box-shadow:0 5px 14px #68840025}.filters{display:flex;gap:12px;padding:17px;background:#fff;border-radius:15px;box-shadow:0 8px 24px #1b252012;margin-bottom:18px}.input,.select{height:42px;border:1px solid #e8e5dd;border-radius:10px;background:#fffbf7;color:#777;padding:0 14px;font-size:12px}.input{width:390px}.select{width:185px}.search{margin-left:auto}.table{background:white;border-radius:16px;box-shadow:0 12px 30px #1b252014;padding:0 20px}.row{display:grid;grid-template-columns:2fr .8fr 1fr 1fr 100px;align-items:center;gap:18px;height:66px;border-bottom:1px solid #efede8}.row:last-child{border:0}.th{height:48px;color:#817f78;font-size:10px;text-transform:uppercase;letter-spacing:.1em}.bar{height:10px;border-radius:8px;background:#e8e8e3}.bar.long{width:220px}.bar.mid{width:84px}.status{height:24px;width:86px;border-radius:99px;background:#edf3d8;border:1px solid #d9e6ae}.draft{background:#faf0eb;border-color:#eed7ca}
  </style>

<body><div class="app"><aside class="side"><div class="brand"><span class="bb">BB</span><span><strong>TraderLab</strong><small>Gestão · Bruno Borges</small></span></div><div class="section">Workspace</div><nav class="nav"><div>Início</div><div>Alunos</div><div>Matrículas</div><div class="active">Cursos</div><div>Banners</div><div>Notificações</div></nav></aside><main class="main"><div class="rail"></div><header class="top"><span class="eyebrow">Ambiente de gestão</span><span class="profile">B</span></header><section class="heading"><div><h1>Cursos</h1><p>Consulte e mantenha o catálogo de cursos da plataforma.</p></div><button class="button">＋&nbsp; Novo curso</button></section><section class="filters"><div class="input">⌕ &nbsp; Buscar cursos pelo título</div><div class="select">Todas as situações &nbsp;⌄</div><div class="search"></div></section><section class="table"><div class="row th"><span>Curso</span><span>Módulos</span><span>Atualizado</span><span>Estado</span><span>Ações</span></div><div class="row"><i class="bar long"></i><i class="bar mid"></i><i class="bar mid"></i><i class="status"></i><i class="bar"></i></div><div class="row"><i class="bar long"></i><i class="bar mid"></i><i class="bar mid"></i><i class="status draft"></i><i class="bar"></i></div><div class="row"><i class="bar long"></i><i class="bar mid"></i><i class="bar mid"></i><i class="status"></i><i class="bar"></i></div><div class="row"><i class="bar long"></i><i class="bar mid"></i><i class="bar mid"></i><i class="status draft"></i><i class="bar"></i></div></section></main></div></body></html>
